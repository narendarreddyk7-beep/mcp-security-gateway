version: 1

# Authoritative capability map. Anything not listed here is reported by the
# manifest auditor as unclassified and refused by the task-class default.
capabilities:
  notes.list_notes:      [private_read]
  notes.read_note:       [private_read]
  web.fetch_url:         [egress, untrusted_inbound]
  mail.list_messages:    [private_read]
  mail.read_message:     [private_read, untrusted_inbound]
  mail.send_message:     [egress, state_change]
  calendar.list_events:  [private_read]
  calendar.read_event:   [private_read, untrusted_inbound]
  echo.echo:             []

task_classes:
  # "Summarise this page." Needs the web, nothing else.
  research:
    tools: [web.fetch_url]
    default: deny

  # "Read the brief, check our notes, email Priya a summary." Legitimately
  # needs all three. Scoping cannot separate the real email from the injected
  # one here - both use a tool this class permits. That is week 4's job.
  brief_and_email:
    tools: [web.fetch_url, notes.read_note, mail.send_message]
    default: deny

  inbox_triage:
    tools: [mail.list_messages, mail.read_message]
    default: deny

  calendar_read:
    tools: [calendar.list_events, calendar.read_event]
    default: deny

  smoke:
    tools: [echo.echo]
    default: deny

rules:
  # Any tool that changes the world outside the session waits for a human.
  # Disabled by default so the benchmark stays deterministic; enable with
  # --approval prompt to demo it.
  - id: state_change_gate
    when: {capability: state_change_disabled}
    action: require_approval
    reason: "Tool changes state outside the session"

  # Week 4. Neither rule references a keyword, a score, a recipient or a
  # domain. They ask one question: where did these arguments come from?

  # Private data on its way out. This is what closes s04 - the injected send
  # carries the credentials note, the real send to Priya carries a summary
  # nobody read from a private source.
  - id: sensitive_egress
    when: {capability: egress, args_taint: sensitive}
    action: deny
    reason: "Private data reaching an egress tool"

  # Attacker-controlled content shaping an outbound call. Noisier than the
  # rule above, because an agent summarising a page legitimately echoes it.
  # Enabled so the false-positive cost shows up in the benchmark rather than
  # being hidden.
  - id: tainted_egress
    when: {capability: egress, args_taint: untrusted}
    action: deny
    reason: "Untrusted content reaching an egress tool"

limits:
  session:
    max_calls: 40
    max_approval_wait_s: 60
