<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP Security Gateway</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --allow: #3fb950; --deny: #f85149; --approve: #d29922;
    --taint: #a371f7; --accent: #58a6ff; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 16px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 57px); }
  .sidebar { border-right: 1px solid var(--border); overflow-y: auto; }
  .main { overflow-y: auto; padding: 24px; }
  .session-item {
    padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .session-item:hover { background: var(--panel); }
  .session-item.active { background: var(--panel); border-left: 3px solid var(--accent); }
  .session-item .sid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .session-item .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
    font-weight: 600; margin-left: 6px;
  }
  .badge.deny { background: rgba(248,81,73,.15); color: var(--deny); }
  .badge.flag { background: rgba(210,153,34,.15); color: var(--approve); }
  .verify {
    font-family: var(--mono); font-size: 12px; padding: 8px 12px; border-radius: 6px;
    margin-bottom: 20px; display: inline-block;
  }
  .verify.ok { background: rgba(63,185,80,.1); color: var(--allow); border: 1px solid rgba(63,185,80,.3); }
  .verify.bad { background: rgba(248,81,73,.1); color: var(--deny); border: 1px solid rgba(248,81,73,.3); }
  .call {
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px;
    overflow: hidden; background: var(--panel);
  }
  .call.deny { border-left: 3px solid var(--deny); }
  .call.allow { border-left: 3px solid var(--allow); }
  .call.require_approval { border-left: 3px solid var(--approve); }
  .call-head {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  }
  .verdict {
    font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase;
    padding: 3px 10px; border-radius: 4px; letter-spacing: .5px;
  }
  .verdict.deny { background: var(--deny); color: #fff; }
  .verdict.allow { background: var(--allow); color: #08130a; }
  .verdict.require_approval { background: var(--approve); color: #1a1200; }
  .tool { font-family: var(--mono); font-weight: 600; }
  .latency { color: var(--muted); font-size: 12px; margin-left: auto; }
  .call-body { padding: 0 16px 12px; }
  .rule { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .rule code { color: var(--approve); }
  .args {
    font-family: var(--mono); font-size: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;
    white-space: pre-wrap; word-break: break-all; color: var(--muted);
  }
  .untrusted-note { color: var(--deny); font-size: 11px; margin-bottom: 6px; }
  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; margin: 24px 0 12px; }
  .taint-row, .flag-row {
    font-family: var(--mono); font-size: 12px; padding: 8px 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    margin-bottom: 6px;
  }
  .taint-label { color: var(--taint); font-weight: 600; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .pill { font-family: var(--mono); font-size: 11px; color: var(--taint); }
</style>
</head>
<body>
<header>
  <h1>MCP Security Gateway</h1>
  <span class="sub">audit log viewer &middot; every tool call, verdict, and taint decision</span>
</header>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main">
    <div class="empty">Select a session on the left.</div>
  </div>
</div>

<script>
// Everything rendered from the API is attacker-influenced (tool arguments,
// injected text, tool names from untrusted servers). It is inserted with
// textContent or via this escape helper, never innerHTML with raw data. A
// security dashboard that XSSed itself on a captured payload would be an
// embarrassing finding.
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

let active = null;

async function loadSessions() {
  const res = await fetch("/api/sessions");
  const sessions = await res.json();
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";
  if (!sessions.length) {
    sb.appendChild(el("div", "empty", "No sessions in this audit log."));
    return;
  }
  for (const s of sessions) {
    const item = el("div", "session-item");
    item.dataset.sid = s.session_id;
    const sid = el("div", "sid", s.session_id);
    item.appendChild(sid);
    const meta = el("div", "meta");
    meta.textContent = `${s.calls} calls`;
    if (s.denied) {
      const b = el("span", "badge deny", `${s.denied} denied`);
      meta.appendChild(b);
    }
    if (s.manifest_flags) {
      meta.appendChild(el("span", "badge flag", `${s.manifest_flags} flagged`));
    }
    item.appendChild(meta);
    if (s.taint_labels) {
      const t = el("div", "meta");
      t.appendChild(el("span", "pill", `${s.taint_labels} taint labels`));
      item.appendChild(t);
    }
    item.onclick = () => selectSession(s.session_id);
    sb.appendChild(item);
  }
  if (!active && sessions.length) selectSession(sessions[0].session_id);
}

async function selectSession(sid) {
  active = sid;
  document.querySelectorAll(".session-item").forEach(i =>
    i.classList.toggle("active", i.dataset.sid === sid));
  const res = await fetch("/api/session/" + encodeURIComponent(sid));
  const data = await res.json();
  render(data);
}

function render(data) {
  const main = document.getElementById("main");
  main.innerHTML = "";

  const v = data.verify;
  const vd = el("div", "verify " + (v.ok ? "ok" : "bad"));
  vd.textContent = v.ok
    ? `\u2713 audit chain intact \u2014 ${v.checked} events verified`
    : `\u2717 audit chain broken at seq ${v.broken_at}`;
  main.appendChild(vd);

  // Manifest findings first: these fire at connect time, before any call.
  if (data.manifest.length) {
    main.appendChild(el("div", "section-title", "manifest audit (at connect time)"));
    for (const m of data.manifest) {
      for (const combo of (m.combinations || [])) {
        const row = el("div", "flag-row");
        row.style.color = "var(--deny)";
        row.textContent = "\u26a0 " + combo;
        main.appendChild(row);
      }
      for (const f of (m.findings || [])) {
        const row = el("div", "flag-row");
        row.innerHTML = `<span style="color:var(--approve)">[${esc(f.kind)}]</span> ${esc(f.tool)}: ${esc(f.detail)}`;
        main.appendChild(row);
      }
    }
  }

  main.appendChild(el("div", "section-title", "tool calls"));
  if (!data.calls.length) {
    main.appendChild(el("div", "empty", "No tool calls in this session."));
  }
  for (const c of data.calls) {
    const call = el("div", "call " + (c.verdict || ""));
    const head = el("div", "call-head");
    head.appendChild(el("span", "verdict " + (c.verdict || ""), c.verdict || "?"));
    head.appendChild(el("span", "tool", c.tool || "?"));
    if (c.latency_ms != null) {
      head.appendChild(el("span", "latency", c.latency_ms.toFixed(1) + " ms"));
    }
    call.appendChild(head);

    const body = el("div", "call-body");
    if (c.rule) {
      const r = el("div", "rule");
      r.innerHTML = "rule: <code>" + esc(c.rule) + "</code>";
      body.appendChild(r);
    }
    if (c.verdict === "deny") {
      body.appendChild(el("div", "untrusted-note",
        "\u2193 arguments below are attacker-influenced \u2014 shown as inert text"));
    }
    const args = el("pre", "args");
    args.textContent = JSON.stringify(c.arguments, null, 2);
    body.appendChild(args);
    call.appendChild(body);
    main.appendChild(call);
  }

  if (data.taint.length) {
    main.appendChild(el("div", "section-title", "taint labels applied"));
    for (const t of data.taint) {
      const row = el("div", "taint-row");
      row.innerHTML = `<span class="taint-label">${esc(t.label)}</span> from ${esc(t.tool)} \u2014 ${esc(t.bytes)} bytes`;
      main.appendChild(row);
    }
  }
}

loadSessions();
setInterval(loadSessions, 3000);  // live-ish: pick up new sessions
</script>
</body>
</html>
