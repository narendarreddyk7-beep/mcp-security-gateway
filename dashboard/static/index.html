<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP Security Gateway</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --allow: #3fb950; --deny: #f85149; --approve: #d29922;
    --taint: #a371f7; --accent: #58a6ff; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 16px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 57px); }
  .sidebar { border-right: 1px solid var(--border); overflow-y: auto; }
  .main { overflow-y: auto; padding: 24px; }
  .session-item {
    padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .session-item:hover { background: var(--panel); }
  .session-item.active { background: var(--panel); border-left: 3px solid var(--accent); }
  .session-item .sid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .session-item .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
    font-weight: 600; margin-left: 6px;
  }
  .badge.deny { background: rgba(248,81,73,.15); color: var(--deny); }
  .badge.flag { background: rgba(210,153,34,.15); color: var(--approve); }
  .verify {
    font-family: var(--mono); font-size: 12px; padding: 8px 12px; border-radius: 6px;
    margin-bottom: 20px; display: inline-block;
  }
  .verify.ok { background: rgba(63,185,80,.1); color: var(--allow); border: 1px solid rgba(63,185,80,.3); }
  .verify.bad { background: rgba(248,81,73,.1); color: var(--deny); border: 1px solid rgba(248,81,73,.3); }
  .call {
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px;
    overflow: hidden; background: var(--panel);
  }
  .call.deny { border-left: 3px solid var(--deny); }
  .call.allow { border-left: 3px solid var(--allow); }
  .call.require_approval { border-left: 3px solid var(--approve); }
  .call-head {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  }
  .verdict {
    font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase;
    padding: 3px 10px; border-radius: 4px; letter-spacing: .5px;
  }
  .verdict.deny { background: var(--deny); color: #fff; }
  .verdict.allow { background: var(--allow); color: #08130a; }
  .verdict.require_approval { background: var(--approve); color: #1a1200; }
  .tool { font-family: var(--mono); font-weight: 600; }
  .latency { color: var(--muted); font-size: 12px; margin-left: auto; }
  .call-body { padding: 0 16px 12px; }
  .rule { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .rule code { color: var(--approve); }
  .args {
    font-family: var(--mono); font-size: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;
    white-space: pre-wrap; word-break: break-all; color: var(--muted);
  }
  .untrusted-note { color: var(--deny); font-size: 11px; margin-bottom: 6px; }
  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; margin: 24px 0 12px; }
  .taint-row, .flag-row {
    font-family: var(--mono); font-size: 12px; padding: 8px 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    margin-bottom: 6px;
  }
  .taint-label { color: var(--taint); font-weight: 600; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .pill { font-family: var(--mono); font-size: 11px; color: var(--taint); }
  .tab {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .tab.active { color: var(--text); border-color: var(--accent); background: var(--panel); }
  #bench-view { padding: 24px; overflow-y: auto; height: calc(100vh - 57px); display: none; }
  table.bench { border-collapse: collapse; margin: 8px 0 28px; font-size: 13px; }
  table.bench th, table.bench td {
    border: 1px solid var(--border); padding: 7px 14px; text-align: right; font-family: var(--mono);
  }
  table.bench th { color: var(--muted); font-weight: 600; text-align: right; }
  table.bench td.name, table.bench th.name { text-align: left; }
  .cell-leak { color: var(--deny); font-weight: 600; }
  .cell-block { color: var(--allow); font-weight: 600; }
  .cell-mid { color: var(--approve); }
  .finding {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--taint);
    border-radius: 8px; padding: 16px 20px; margin: 8px 0 28px; max-width: 780px;
  }
  .finding h3 { margin: 0 0 8px; font-size: 14px; }
  .finding p { margin: 0 0 10px; color: var(--muted); }
  .sweep-bar { display: flex; align-items: center; gap: 10px; margin: 3px 0; font-family: var(--mono); font-size: 12px; }
  .sweep-bar .th { width: 36px; text-align: right; color: var(--muted); }
  .sweep-bar .track { flex: 1; max-width: 380px; height: 20px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; position: relative; }
  .sweep-bar .verdict-chip { width: 68px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>MCP Security Gateway</h1>
  <span class="sub">audit log viewer &middot; every tool call, verdict, and taint decision</span>
  <nav style="margin-left:auto; display:flex; gap:4px;">
    <button class="tab active" id="tab-sessions" onclick="showView('sessions')">Sessions</button>
    <button class="tab" id="tab-bench" onclick="showView('bench')">Benchmark &amp; finding</button>
  </nav>
</header>
<div class="layout" id="sessions-view">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main">
    <div class="empty">Select a session on the left.</div>
  </div>
</div>
<div id="bench-view"></div>

<script>
// Everything rendered from the API is attacker-influenced (tool arguments,
// injected text, tool names from untrusted servers). It is inserted with
// textContent or via this escape helper, never innerHTML with raw data. A
// security dashboard that XSSed itself on a captured payload would be an
// embarrassing finding.
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

let active = null;

function showView(which) {
  document.getElementById("sessions-view").style.display = which === "sessions" ? "grid" : "none";
  document.getElementById("bench-view").style.display = which === "bench" ? "block" : "none";
  document.getElementById("tab-sessions").classList.toggle("active", which === "sessions");
  document.getElementById("tab-bench").classList.toggle("active", which === "bench");
  if (which === "bench") loadBenchmark();
}

const CONFIG_ORDER = ["none", "audit", "policy", "full", "coarse"];

async function loadBenchmark() {
  const view = document.getElementById("bench-view");
  view.innerHTML = "";
  const res = await fetch("/api/benchmark");
  const data = await res.json();

  if (!data.benchmark) {
    view.appendChild(el("div", "empty",
      "No benchmark.json yet. Run: python3 -m harness.bench --json docs/benchmark.json"));
    return;
  }

  // Aggregate rows into per-config summary and per-scenario grid.
  const rows = data.benchmark;
  const byConfig = {};
  const scenarios = {};
  for (const r of rows) {
    const c = byConfig[r.config] || (byConfig[r.config] = {attack:[], benign:[]});
    (r.kind === "attack" ? c.attack : c.benign).push(r);
    if (r.kind === "attack") (scenarios[r.scenario] = scenarios[r.scenario] || {})[r.config] = r.attack_succeeded;
  }

  view.appendChild(el("h2", null, "Attack success and utility cost").also(h => h.style.fontSize="16px"));

  // Summary table
  const t1 = el("table", "bench");
  t1.innerHTML = `<tr><th class="name">config</th><th>attack success</th>
    <th>benign done</th><th>false pos</th><th>task under attack</th></tr>`;
  for (const cfg of CONFIG_ORDER) {
    const c = byConfig[cfg]; if (!c) continue;
    const asr = mean(c.attack.map(r=>r.attack_succeeded));
    const bcr = mean(c.benign.map(r=>r.task_completed));
    const tua = mean(c.attack.map(r=>r.task_completed));
    const tr = el("tr");
    tr.innerHTML = `<td class="name">${esc(cfg)}</td>
      <td class="${asr>0?'cell-leak':'cell-block'}">${pct(asr)}</td>
      <td>${pct(bcr)}</td>
      <td class="${(1-bcr)>0?'cell-mid':''}">${pct(1-bcr)}</td>
      <td>${pct(tua)}</td>`;
    t1.appendChild(tr);
  }
  view.appendChild(t1);

  // Per-scenario grid: the layered-defence argument
  view.appendChild(el("h2", null, "Which layer stops which attack").also(h=>h.style.fontSize="16px"));
  const t2 = el("table", "bench");
  let head = `<tr><th class="name">scenario</th>` +
    CONFIG_ORDER.map(c=>`<th>${esc(c)}</th>`).join("") + `</tr>`;
  t2.innerHTML = head;
  for (const sid of Object.keys(scenarios).sort()) {
    const tr = el("tr");
    let cells = `<td class="name">${esc(sid)}</td>`;
    for (const cfg of CONFIG_ORDER) {
      const leaked = scenarios[sid][cfg];
      cells += `<td class="${leaked?'cell-leak':'cell-block'}">${leaked?'LEAK':'block'}</td>`;
    }
    tr.innerHTML = cells;
    t2.appendChild(tr);
  }
  view.appendChild(t2);

  // The finding + sweep
  const f = el("div", "finding");
  f.innerHTML = `<h3>The finding: fragmentation defeats content-based taint</h3>
    <p>s06 splits the secret into six-character fragments. The sensitive-content
    match only catches pieces this small when the overlap threshold drops to
    roughly the fragment size &mdash; a value so low it fires on coincidental
    short strings in ordinary traffic. Only content-blind coarse taint stops it,
    at the utility cost shown above.</p>`;
  view.appendChild(f);

  if (data.sweep) {
    view.appendChild(el("h2", null, "Threshold sweep (sensitive rule, s06)").also(h=>h.style.fontSize="16px"));
    for (const row of data.sweep) {
      const leaks = row.s06_attack_success === 1;
      const bar = el("div", "sweep-bar");
      bar.innerHTML = `<span class="th">${row.threshold}</span>
        <span class="verdict-chip ${leaks?'cell-leak':'cell-block'}">${leaks?'LEAKS':'caught'}</span>
        <span style="color:var(--muted)">${row.false_positives}/${row.benign_total} benign blocked</span>`;
      view.appendChild(bar);
    }
  }
}

function mean(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0; }
function pct(x){ return Math.round(x*100) + "%"; }
// tiny chainable helper so we can style created elements inline
Object.defineProperty(HTMLElement.prototype, "also", {
  value: function(fn){ fn(this); return this; }, configurable: true
});

async function loadSessions() {
  const res = await fetch("/api/sessions");
  const sessions = await res.json();
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";
  if (!sessions.length) {
    sb.appendChild(el("div", "empty", "No sessions in this audit log."));
    return;
  }
  for (const s of sessions) {
    const item = el("div", "session-item");
    item.dataset.sid = s.session_id;
    const sid = el("div", "sid", s.session_id);
    item.appendChild(sid);
    const meta = el("div", "meta");
    meta.textContent = `${s.calls} calls`;
    if (s.denied) {
      const b = el("span", "badge deny", `${s.denied} denied`);
      meta.appendChild(b);
    }
    if (s.manifest_flags) {
      meta.appendChild(el("span", "badge flag", `${s.manifest_flags} flagged`));
    }
    item.appendChild(meta);
    if (s.taint_labels) {
      const t = el("div", "meta");
      t.appendChild(el("span", "pill", `${s.taint_labels} taint labels`));
      item.appendChild(t);
    }
    item.onclick = () => selectSession(s.session_id);
    sb.appendChild(item);
  }
  if (!active && sessions.length) selectSession(sessions[0].session_id);
}

async function selectSession(sid) {
  active = sid;
  document.querySelectorAll(".session-item").forEach(i =>
    i.classList.toggle("active", i.dataset.sid === sid));
  const res = await fetch("/api/session/" + encodeURIComponent(sid));
  const data = await res.json();
  render(data);
}

function render(data) {
  const main = document.getElementById("main");
  main.innerHTML = "";

  const v = data.verify;
  const vd = el("div", "verify " + (v.ok ? "ok" : "bad"));
  vd.textContent = v.ok
    ? `\u2713 audit chain intact \u2014 ${v.checked} events verified`
    : `\u2717 audit chain broken at seq ${v.broken_at}`;
  main.appendChild(vd);

  // Manifest findings first: these fire at connect time, before any call.
  if (data.manifest.length) {
    main.appendChild(el("div", "section-title", "manifest audit (at connect time)"));
    for (const m of data.manifest) {
      for (const combo of (m.combinations || [])) {
        const row = el("div", "flag-row");
        row.style.color = "var(--deny)";
        row.textContent = "\u26a0 " + combo;
        main.appendChild(row);
      }
      for (const f of (m.findings || [])) {
        const row = el("div", "flag-row");
        row.innerHTML = `<span style="color:var(--approve)">[${esc(f.kind)}]</span> ${esc(f.tool)}: ${esc(f.detail)}`;
        main.appendChild(row);
      }
    }
  }

  main.appendChild(el("div", "section-title", "tool calls"));
  if (!data.calls.length) {
    main.appendChild(el("div", "empty", "No tool calls in this session."));
  }
  for (const c of data.calls) {
    const call = el("div", "call " + (c.verdict || ""));
    const head = el("div", "call-head");
    head.appendChild(el("span", "verdict " + (c.verdict || ""), c.verdict || "?"));
    head.appendChild(el("span", "tool", c.tool || "?"));
    if (c.latency_ms != null) {
      head.appendChild(el("span", "latency", c.latency_ms.toFixed(1) + " ms"));
    }
    call.appendChild(head);

    const body = el("div", "call-body");
    if (c.rule) {
      const r = el("div", "rule");
      r.innerHTML = "rule: <code>" + esc(c.rule) + "</code>";
      body.appendChild(r);
    }
    if (c.verdict === "deny") {
      body.appendChild(el("div", "untrusted-note",
        "\u2193 arguments below are attacker-influenced \u2014 shown as inert text"));
    }
    const args = el("pre", "args");
    args.textContent = JSON.stringify(c.arguments, null, 2);
    body.appendChild(args);
    call.appendChild(body);
    main.appendChild(call);
  }

  if (data.taint.length) {
    main.appendChild(el("div", "section-title", "taint labels applied"));
    for (const t of data.taint) {
      const row = el("div", "taint-row");
      row.innerHTML = `<span class="taint-label">${esc(t.label)}</span> from ${esc(t.tool)} \u2014 ${esc(t.bytes)} bytes`;
      main.appendChild(row);
    }
  }
}

loadSessions();
setInterval(loadSessions, 3000);  // live-ish: pick up new sessions
</script>
</body>
</html>
